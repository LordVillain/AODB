version: '3.8'
services:
  zookeeper-lab2:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper-lab2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka-lab2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-lab2
    depends_on:
      - zookeeper-lab2
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-lab2:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-lab2:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1